# Builds the Prism guide (site/ -> site-dist/ via npm run site) and publishes it to
# GitHub Pages: https://hellovvn.github.io/spicetify-prism/
# Needs Settings > Pages > Source = "GitHub Actions" (once).
# Pull requests only build it, so a broken page is caught before merging.
name: Guide site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/media/**", "scripts/site.mjs", "src/assets/prism.svg", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "docs/media/**", "scripts/site.mjs", "src/assets/prism.svg", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the site
        run: npm run site

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site-dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
